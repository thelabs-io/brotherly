[project]
name = "brotherly"
version = "0.1.0"
description = "Transparent remote administration - review and approve scripts before they run"
requires-python = ">=3.11"
authors = [{ name = "Chris Franson", email = "chris@iolabs.dev" }]
dependencies = [
    "textual>=0.89.0",
    "rich>=13.0.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "textual-dev>=1.0.0",
]

[project.scripts]
brotherly = "brotherly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brotherly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
